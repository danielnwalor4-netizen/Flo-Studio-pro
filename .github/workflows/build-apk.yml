name: Build Flo Studio Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug keystore..."
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            echo "No custom debug keystore found."
            echo "Generating a temporary debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s debug.keystore
          echo "Debug keystore is available."

      - name: Create .env if missing
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flo-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
